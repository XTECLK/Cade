name = "cade"
main = "src/index.js"
compatibility_date = "2026-10-13"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

# Workers AI, for reading messages in task threads (see src/ai.js).
[ai]
binding = "AI"
